name: Test

on:
  # Only master: on a branch with a pull request, a push would otherwise run the tests twice (once for push, once for pull_request)
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Windows fix. See https://github.com/actions/checkout/issues/226
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      # todo remove once fixed https://github.com/actions/setup-node/issues/531
      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn dedupe --check
      - run: yarn test
      - run: yarn tsc
      - run: yarn lint
      - run: yarn build
      - name: Check docs
        run: |
          yarn generate-docs
          git diff --quiet HEAD
          git reset --hard HEAD
      - run: yarn check-licenses
      - name: Generate licenses
        run: |
          yarn generate-licenses
          git reset --hard HEAD

  notification-desktop-e2e:
    name: Notification desktop E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.os == 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --immutable

      # Dependency install scripts are disabled by .yarnrc.yml.
      - run: yarn run install-electron --no

      - name: Download Linux FFmpeg binaries
        if: runner.os == 'Linux'
        run: yarn download-ffmpeg-linux-x64

      - name: Download Windows FFmpeg binaries
        if: runner.os == 'Windows'
        run: yarn download-ffmpeg-win32-x64

      - run: yarn build

      - name: Run notification desktop E2E tests (Linux Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node script/e2eNotifications.ts

      - name: Run notification desktop E2E tests (Windows offscreen)
        if: runner.os == 'Windows'
        run: node script/e2eNotifications.ts

      - name: Upload notification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-desktop-e2e-screenshots-${{ matrix.os }}
          path: artifacts/notification-e2e/
          if-no-files-found: ignore
