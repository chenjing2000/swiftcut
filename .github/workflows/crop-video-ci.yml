name: Crop Video Windows CI

on:
  push:
    branches:
      - feature/crop-video
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn test --run
      - run: yarn tsc
      - run: yarn lint
      - run: yarn build
